name: Cleanup Actions storage

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  cleanup:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name != 'Cleanup Actions storage'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts produced by the completed run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.info(`Cleaning artifacts for run ${runId} (${context.payload.workflow_run.name})`);
            let page = 1;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: runId, per_page: 100, page,
              });
              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`deleted artifact ${artifact.name} (${artifact.id}, ${artifact.size_in_bytes} bytes)`);
              }
              if (data.artifacts.length < 100) break;
              page++;
            }
