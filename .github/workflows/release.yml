name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  cleanup:
    name: 🧹 Cleanup Actions storage
    needs: goreleaser
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts of this run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.run_id }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.info(`Cleaning artifacts for run ${runId}`);
            let page = 1;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: runId, per_page: 100, page,
              });
              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`deleted artifact ${artifact.name} (${artifact.id}, ${artifact.size_in_bytes} bytes)`);
              }
              if (data.artifacts.length < 100) break;
              page++;
            }
