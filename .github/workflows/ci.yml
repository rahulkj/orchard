name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./... -race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  cleanup:
    name: 🧹 Cleanup Actions storage
    needs: build-test
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts of this run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.run_id }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.info(`Cleaning artifacts for run ${runId}`);
            let page = 1;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: runId, per_page: 100, page,
              });
              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`deleted artifact ${artifact.name} (${artifact.id}, ${artifact.size_in_bytes} bytes)`);
              }
              if (data.artifacts.length < 100) break;
              page++;
            }
